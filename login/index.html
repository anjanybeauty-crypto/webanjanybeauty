<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Wave Login Form</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tab-container {
            display: flex;
            margin-bottom: 24px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: rgba(255,255,255,0.25);
            color: white;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        #alertBox, #registerAlert, #registerSuccess {
            display: none;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            text-align: center;
        }
        #alertBox { background: rgba(255,80,80,0.3); color: white; }
        #registerAlert { background: rgba(255,80,80,0.3); color: white; }
        #registerSuccess { background: rgba(80,255,150,0.3); color: white; }
    </style>
</head>
<body>
    <div class="wave-container">
        <div class="wave wave-1"></div>
        <div class="wave wave-2"></div>
        <div class="wave wave-3"></div>
        <div class="wave wave-4"></div>
    </div>
    <div class="gradient-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    <div class="login-container">
        <div class="login-card">
            <div class="card-glow"></div>
            <div class="login-header">
                <div class="gradient-icon">
                    <div class="icon-wave"></div>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h2>Welcome</h2>
                <p>Sign in or create an account</p>
            </div>
            <div class="tab-container">
                <button class="tab-btn active" onclick="switchTab('login', this)">Sign In</button>
                <button class="tab-btn" onclick="switchTab('register', this)">Register</button>
            </div>
            <div class="tab-content active" id="tab-login">
                <div id="alertBox"></div>
                <form class="login-form" id="loginForm" novalidate>
                    <div class="form-group">
                        <div class="input-container">
                            <div class="input-bg"></div>
                            <input type="text" id="loginUsername" required placeholder=" ">
                            <label>Username</label>
                            <div class="input-wave"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-container password-container">
                            <div class="input-bg"></div>
                            <input type="password" id="loginPassword" required placeholder=" ">
                            <label>Password</label>
                            <div class="input-wave"></div>
                        </div>
                    </div>
                    <button type="submit" class="gradient-button">
                        <div class="button-bg"></div>
                        <div class="button-content">
                            <span class="btn-text">Sign In</span>
                        </div>
                    </button>
                </form>
            </div>
            <div class="tab-content" id="tab-register">
                <div id="registerAlert"></div>
                <div id="registerSuccess"></div>
                <form class="login-form" id="registerForm" novalidate>
                    <div class="form-group">
                        <div class="input-container">
                            <div class="input-bg"></div>
                            <input type="text" id="username" required placeholder=" ">
                            <label>Username</label>
                            <div class="input-wave"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-container">
                            <div class="input-bg"></div>
                            <input type="email" id="email" required placeholder=" ">
                            <label>Email</label>
                            <div class="input-wave"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-container password-container">
                            <div class="input-bg"></div>
                            <input type="password" id="password" required placeholder=" ">
                            <label>Password</label>
                            <div class="input-wave"></div>
                        </div>
                    </div>
                    <button type="submit" class="gradient-button">
                        <div class="button-bg"></div>
                        <div class="button-content">
                            <span class="btn-text">Create Account</span>
                        </div>
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script src="../../shared/js/form-utils.js"></script>
    <script src="script.js"></script>
    <script>
        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            btn.classList.add('active');
        }
    </script>
    <script src="js/login.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
